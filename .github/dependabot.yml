version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # keep the 3D stack in step: these packages are tightly version-coupled
      three:
        patterns: ["three", "@types/three", "@react-three/*", "postprocessing"]
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
